sfdc_config:
  conn_id: "sfdc_conn_id"
  config_path: "config/sfdc_config.yaml"
  config_type: "plain_text"
  bulk_api_flag: "True"
  metadata:
    allowed_config_types: ["plain_text", "gcp_secret_manager", "aws_secrets_manager", "azure_key_vault"]


sink_config:
  conn_id: "postgresql_conn_id"
  config_path: "config/sink_config.yaml"
  config_type: "plain_text"
  metadata:
    allowed_config_types: ["plain_text", "gcp_secret_manager", "aws_secrets_manager", "azure_key_vault"]

metadata:
    allowed_primary_keys: ["id"]
    allowed_full_replication_types: ["truncate_reload", "TR","overwrite", "full"]
    allowed_incremental_replication_types: ["append", "incremental"]
    allowed_replication_keys: ["lastmodifieddate"]

replication_config:
  conn_id: "replication_config"
  config_path: "config/sink_config.yaml"
  config_type: "plain_text"


tables:

  account:
    sfdc_table: "account"
    replication_type: "incremental"
    sink_dbname: "sfdc_stage"
    sink_schema: "sfdc_stage"
    sink_table: "account"
    replication_key: "lastmodifieddate"
    primary_key: "id"
    query: "SELECT AccountNumber, AccountSource, Active__c, AnnualRevenue, BillingStreet, BillingCity, BillingState, BillingPostalCode, BillingCountry, BillingLatitude, BillingLongitude, BillingGeocodeAccuracy, CreatedById, CreatedDate, CustomerPriority__c, Description, DunsNumber, Fax, Id, Industry, IsDeleted, LastActivityDate, LastModifiedById, LastModifiedDate, Name, NumberOfEmployees, OwnerId, Ownership, ParentId, Phone, Rating, ShippingStreet, ShippingCity, ShippingState, ShippingPostalCode, ShippingCountry, ShippingLatitude, ShippingLongitude, ShippingGeocodeAccuracy, Site, SLA__c, SLAExpirationDate__c, SLASerialNumber__c, SystemModstamp, TickerSymbol, Type, Website, YearStarted FROM Account"
    filter: "WHERE lastmodifieddate > '2021-01-01T00:00:00Z'" # Not implemented Yet.

  contact:
    sfdc_table: "contact"
    replication_type: "incremental"
    sink_dbname: "sfdc_stage"
    sink_schema: "sfdc_stage"
    sink_table: "contact"
    replication_key: "lastmodifieddate"
    primary_key: "id"
    query: "SELECT Id, Name, isdeleted, lastmodifieddate FROM Contact"
    filter: "WHERE lastmodifieddate > '2021-01-01T00:00:00Z'" # Not implemented Yet.


